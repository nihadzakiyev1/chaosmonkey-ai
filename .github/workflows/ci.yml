name: verify
on: [push, pull_request]
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: chaosmonkey-web/package-lock.json}
      - run: npm ci && npm run build
        working-directory: chaosmonkey-web
      - run: mvn -B -ntp -pl chaosmonkey-engine org.codehaus.mojo:exec-maven-plugin:3.6.2:java -Dexec.mainClass=com.microsoft.playwright.CLI '-Dexec.args=install --with-deps chromium'
      - run: mvn -B -ntp verify -Dchaos.browser=true
      - run: docker compose --env-file .env.example config --quiet
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: chaosmonkey-web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: chaosmonkey-web/package-lock.json}
      - run: npm ci
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build -d
      - run: python scripts/smoke.py
      - if: failure()
        run: docker compose logs --tail 150
      - if: always()
        run: docker compose down --volumes
