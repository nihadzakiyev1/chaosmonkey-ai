# Desktop mode: API, dashboard and worker share one process and a persistent local database.
debug=false
spring.config.import=optional:file:./data/local/credentials.properties
server.address=127.0.0.1
server.port=3000
spring.datasource.url=jdbc:h2:file:./data/local/chaosmonkey;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.web.resources.static-locations=file:./chaosmonkey-web/dist/
spring.rabbitmq.password=unused-local-mode
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
spring.rabbitmq.dynamic=false
spring.data.redis.repositories.enabled=false
management.health.rabbit.enabled=false
management.health.redis.enabled=false
chaos.broker-notifications=false
chaos.admin-user=admin
chaos.demo-url=http://localhost:8090
chaos.evidence-directory=./data/evidence
