<!doctype html><html lang="en"><meta charset="utf-8"><title>Chaos Store · Sandbox</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:18px system-ui;background:#121625;color:#e8ebfa;max-width:760px;margin:70px auto;padding:24px}button,input{font:inherit;padding:12px;border-radius:8px;margin:6px}button{background:#ad97ff;border:0;cursor:pointer}a{color:#8ee4ea}article{padding:24px;background:#20263b;border-radius:20px}pre{white-space:pre-wrap}</style><nav aria-label="Store"><a href="/">Catalog</a> · <a href="#cart">Cart</a> · <a href="#orders">Order history</a></nav><h1>Chaos Store</h1><p>Isolated fixtures. Mock payments. No real purchases.</p><article><h2>Mechanical keyboard</h2><p>$100.00 · Product p1</p><button id="add" data-testid="add-to-cart">Add to cart</button></article><section id="cart"><h2>Checkout</h2><form id="coupon-form"><label for="coupon">Coupon code</label><input id="coupon" value="CHAOS10"><button type="submit">Apply coupon</button></form><button id="checkout" data-testid="checkout">Place sandbox order</button><button id="refresh">Refresh state</button></section><section id="orders"><h2>Order history & inventory</h2><pre id="state" aria-live="polite">Loading…</pre></section><script>
let fixture=new URLSearchParams(location.search).get('fixture');const key='checkout-'+fixture;
async function api(path,body){const r=await fetch('/api/fixtures/'+fixture+'/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function refresh(){document.querySelector('#state').textContent=JSON.stringify(await api('state'),null,2)}
document.querySelector('#add').onclick=async()=>{await api('cart',{quantity:1});await refresh()};
document.querySelector('#coupon-form').onsubmit=async e=>{e.preventDefault();await api('coupon',{code:document.querySelector('#coupon').value});await refresh()};
document.querySelector('#checkout').onclick=async()=>{try{await api('checkout',{idempotencyKey:key});await refresh()}catch(e){document.querySelector('#state').textContent=e.message}};
document.querySelector('#refresh').onclick=refresh;
(async()=>{if(!fixture){fixture=(await(await fetch('/api/fixtures',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({defect:'NONE'})})).json()).id;location.replace('/?fixture='+fixture)}else await refresh()})();
</script></html>
